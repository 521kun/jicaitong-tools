<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>集材通 · 业务工具（本地版）</title>
  <style>
    body{margin:0;background:#f3f6f8;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#172533}
    .wrap{max-width:860px;margin:0 auto;padding:48px 24px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;margin-bottom:8px}
    .mark{width:38px;height:38px;border-radius:9px;background:#1768ab;color:#fff;display:grid;place-items:center;font-size:20px}
    .note{color:#687987;margin:0 0 32px}
    a.card{display:flex;gap:18px;align-items:flex-start;background:#fff;border:1px solid #d8e1e7;border-radius:10px;padding:22px 24px;margin-bottom:16px;text-decoration:none;color:inherit}
    a.card:hover{border-color:#1768ab;box-shadow:0 4px 16px rgba(23,104,171,.12)}
    .icon{width:44px;height:44px;border-radius:9px;background:#eaf1f5;color:#1768ab;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
    h2{margin:0 0 6px;font-size:17px}
    p.desc{margin:0;color:#526572;font-size:13px}
    .foot{margin-top:28px;color:#98a7b2;font-size:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="mark">集</span><span>集材通 · 业务工具（本地版）</span></div>
    <p class="note">工具完全在本机浏览器运行，文件不上传。点击下面任意工具即可开始使用。</p>
    <a class="card" href="tools/watermark/index.html">
      <span class="icon">印</span>
      <span><h2>图片水印与资料标签</h2><p class="desc">给现场图片添加水印、交易编号和资料标签，支持逐张精修与 ZIP 批量导出。适合行驶证、车辆照片、磅单。</p></span>
    </a>
    <a class="card" href="tools/weighbill/index.html">
      <span class="icon">单</span>
      <span><h2>报单计算工具</h2><p class="desc">导入开票信息后进行校验、月度编号登记，并导出业务台账与打印磅单。本地读取 Excel，不上传文件。</p></span>
    </a>
    <p class="foot">本地离线版 · 请使用 Chrome、Edge 或 Safari 打开</p>
  </main>
</body>
</html>
